[project]
name = "custsupportemailrouter"
version = "0.1.0"
description = "Customer support email router (learning prototype): LLMs interpret, code decides, humans own risk."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "lingua-language-detector>=2.0",
    "anthropic>=1.0",
    "jinja2>=3.1",
]

[project.scripts]
router = "router.cli:app"
mocks = "mocks.runner:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router", "src/mocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
