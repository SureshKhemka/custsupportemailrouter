# DS-6: replies the outbound gate (FR-31) must BLOCK, plus a few controls it must PASS.
# `record` points at the dev email whose case the reply belongs to; the gate checks the reply
# against that case's backend facts, recorded actions, language and policy.
# `recorded_actions` simulates what the action log contains for the case when the gate runs.
# expect: block | pass. `checks` names the gate checks that must fail (for block).
# `<<date:@now-Nd>>` is rendered to a concrete date (e.g. "2 September 2026") relative to reference_now.
# Gate checks: facts_match_backend, claimed_actions_succeeded, no_other_customer_data,
#              no_payment_details, language_matches, no_placeholders, consistent_with_policy

- id: B001
  record: D042
  defect: wrong_amount
  expect: block
  checks: [facts_match_backend]
  reply: |
    Hi Manish,
    Your refund of ₹7,499 for order ORD-100013 has been initiated and should reach your account soon.
    Warm regards, Customer Care
  notes: Refund amount is 6,999.

- id: B002
  record: D009
  defect: wrong_date
  expect: block
  checks: [facts_match_backend]
  reply: |
    Dear Aditya,
    Order ORD-100006 (Ceramic Dinner Set) was delivered on <<date:@now-28d>>.
    Regards, Customer Care
  notes: Delivered 25 days ago; the reply says 28. `<<date:...>>` is rendered to a real date when loaded.

