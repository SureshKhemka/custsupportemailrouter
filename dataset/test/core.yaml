- id: T015
  tags: [very_long]
  email:
    from: {email: alisha.fernandes@example.com, name: Alisha Fernandes}
    subject: Mixer grinder - long story, sorry!
    received_at: "@now-0.1d"
    body: |
      Hi there,

      Sorry in advance, this is going to be a long one. My mother's old mixer grinder finally gave up last week after fifteen years,
      which honestly is a record, and she has been grinding chutney on a stone since then which she says is "how it should be done"
      but I can see her wrists hurting. So I ordered the 750W Mixer Grinder from you, order ORD-100159, as a surprise.

      Here's my problem. I'm at work until seven and she doesn't know about the parcel. If the delivery person rings the bell and she
      sees a big box she'll ask a hundred questions and ruin the surprise, but if nobody opens the door the parcel goes back, and I
      don't want to wait another week. The app says "out for delivery" since this morning.

      I also saw that some people online complained that the jar lids on this model are a bit loose, which I'm not too worried about,
      just mentioning it in case you know anything.

      Could you please confirm whether it's actually going to be delivered today and give me the tracking number so I can call the
      courier myself and ask them to come after seven?

      Thanks so much and sorry for the essay!
      Alisha
  label:
    order: ORD-100159
    intents:
      - {intent: order_status, order_id: ORD-100159, mode: AUTO, decision: {delivery_state: out_for_delivery}, entities: {order_ids: [ORD-100159]}}
    case: {mode: AUTO, disposition: auto_replied}
    reply:
      must_contain: [{tracking: BD9198789626IN}]
      must_not_contain: [{text: "after seven"}]

