- id: T037
  tags: [wrong_facts_quoted, failed_payment]
  email:
    from: {email: yash.thakur@example.com, name: Yash Thakur}
    subject: Double charged?
    received_at: "@now-0.1d"
    body: |
      I think you charged me twice for ORD-100040. Two debits of ₹1,499 in my card app. Please refund one.
  label:
    order: ORD-100040
    intents:
      - {intent: billing_dispute, order_id: ORD-100040, mode: ROUTE, decision: {duplicate_charge: false, failed_payment: true}, entities: {order_ids: [ORD-100040], amounts: [1499]}}
    case: {mode: ROUTE, disposition: routed, queue: billing}
    forbidden_actions: [issue_refund]
    notes: One attempt failed and one succeeded; not a duplicate capture. Billing agent explains.

