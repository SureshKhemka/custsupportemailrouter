# Returns (eligibility decided by code, PO-1) and refund status (reported from the refund service).
- id: D031
  tags: [simple, return_window_inside]
  email:
    from: {email: harsh.vardhan@example.com, name: Harsh Vardhan}
    subject: Return jeans ORD-100015
    received_at: "@now-0.1d"
    body: |
      Hi, the slim fit jeans from ORD-100015 don't fit well. I'd like to return them please.
      Harsh
  label:
    order: ORD-100015
    intents:
      - {intent: return_request, order_id: ORD-100015, mode: AUTO, decision: {eligible: true, reason: eligible}, entities: {order_ids: [ORD-100015], items: [slim fit jeans], remedy: refund}}
    case: {mode: AUTO, disposition: auto_replied}
    actions:
      - {type: create_return, order_id: ORD-100015, lines: [{line_id: ORD-100015-L1, qty: 1}]}
    forbidden_actions: [issue_refund]
    reply:
      must_contain: [{order_id: ORD-100015}]
      must_not_contain: [{text: "refund has been issued"}, {text: "refunded"}]
    notes: Delivered 29 days ago. The platform refunds after pickup (D-002); the router must not issue or promise a refund date.

