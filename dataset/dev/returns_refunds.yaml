- id: D049
  tags: [wrong_facts_quoted]
  email:
    from: {email: gaurav.bhatia@example.com, name: Gaurav Bhatia}
    subject: Where is my refund?
    received_at: "@now-0.1d"
    body: |
      I was told I'd get a refund of ₹1,599 for the hair dryer in ORD-100074. Nothing yet. Please check.
  label:
    order: ORD-100074
    intents:
      - {intent: refund_status, order_id: ORD-100074, mode: AUTO, decision: {state: none, amount: 0.0}, entities: {order_ids: [ORD-100074], amounts: [1599]}}
    case: {mode: AUTO, disposition: auto_replied}
    forbidden_actions: [issue_refund]
    reply:
      must_contain: [{order_id: ORD-100074}]
      must_not_contain: [{text: "refund of ₹1,599 has been"}, {text: "refund has been initiated"}]
    notes: No refund exists; the reply must say none is on record, not confirm the customer's claim.

