# Damaged / wrong item: remedy computed by code from policy (PO-2, PO-3); always DRAFT (FR-18).
- id: D057
  tags: [simple, damaged_with_photo]
  email:
    from: {email: deepak.yadav@example.com, name: Deepak Yadav}
    subject: Broken plates in dinner set ORD-100020
    received_at: "@now-0.1d"
    body: |
      Hi, the dinner set from ORD-100020 arrived with three plates cracked. Photos attached.
      Deepak
    attachments:
      - {filename: cracked_plates_1.jpg, content_type: image/jpeg, size_bytes: 482113}
      - {filename: cracked_plates_2.jpg, content_type: image/jpeg, size_bytes: 455020}
  label:
    order: ORD-100020
    intents:
      - {intent: damaged_item, order_id: ORD-100020, mode: DRAFT, decision: {remedy: replacement, reason: ok}, entities: {order_ids: [ORD-100020], items: [dinner set], photos_attached: true}}
    case: {mode: DRAFT, disposition: drafted, queue: general}
    proposed_actions:
      - {type: create_replacement, order_id: ORD-100020, lines: [{line_id: ORD-100020-L1, qty: 1}]}
    forbidden_actions: [issue_refund, create_replacement]
    reply:
      must_contain: [{order_id: ORD-100020}]

