    from: {email: kavya.menon@example.com, name: Kavya Menon}
    subject: Air fryer ORD-100004
    received_at: "@now-0.3d"
    body: |
      Hi, where is my air fryer, order ORD-100004?
  label:
    order: ORD-100004
    intents:
      - {intent: order_status, order_id: ORD-100004, mode: AUTO, decision: {delivery_state: in_transit}, entities: {order_ids: [ORD-100004]}}
    case: {mode: AUTO, disposition: auto_replied}
    reply:
      must_contain: [{order_id: ORD-100004}, {tracking: EK8667526689IN}]

