- id: D024
  tags: [very_long]
  email:
    from: {email: pranav.kulkarni@example.com, name: Pranav Kulkarni}
    subject: Regarding my order - smartwatches and earbuds for my sister's wedding
    received_at: "@now-0.1d"
    body: |
      Hello,

      I hope you are doing well. I am writing because I am a bit anxious about an order I placed with you. Let me give you some
      background first so that you understand why this matters so much to me. My younger sister is getting married this weekend
      and our family has a tradition of giving small gifts to the groom's side, so I decided to order two smartwatches and a pair
      of wireless earbuds from your website. I have ordered from you many times before, mostly books and kitchen items, and I have
      always been happy, which is why I chose you again even though a local shop had similar watches.

      The order number is ORD-100107. I placed it a few days ago and I got an email saying it was dispatched. Since then I have been
      checking the app every few hours. Today the app shows something like "out for delivery" but I am not sure if that means it will
      come today or tomorrow, and my whole family is going to be out of the house in the evening for the mehendi function, so I need
      to plan who stays back to receive the parcel. My mother says I worry too much, and she may be right, but I really cannot afford
      for this to go wrong because the gifts have to be packed and labelled before Friday.

      Also, one more small thing, last time I ordered a pressure cooker the delivery person called me from a number I didn't recognise
      and I missed the call, so if there is any way to know which number will call, that would be great, but it is not the main issue.

      So my main question is simply: is the parcel really coming today, and can you confirm the tracking details?

      Thank you so much for your patience in reading this long email.
      Warm regards,
      Pranav Kulkarni
  label:
    order: ORD-100107
    intents:
      - {intent: order_status, order_id: ORD-100107, mode: AUTO, decision: {delivery_state: out_for_delivery}, entities: {order_ids: [ORD-100107], items: [smartwatches, wireless earbuds]}}
    case: {mode: AUTO, disposition: auto_replied}
    reply:
      must_contain: [{order_id: ORD-100107}, {tracking: DL6604502480IN}]
      must_not_contain: [{text: "before Friday"}]

