# Order status ("where is my order?"), the largest category (~45% of real traffic).
- id: D001
  tags: [simple]
  email:
    from: {email: kavya.menon@example.com, name: Kavya Menon}
    subject: Where is my order ORD-100004?
    received_at: "@now-0.1d"
    body: |
      Hi,
      I ordered an air fryer two days ago, order ORD-100004. Could you tell me where it is right now?
      Thanks,
      Kavya
  label:
    order: ORD-100004
    intents:
      - {intent: order_status, order_id: ORD-100004, mode: AUTO, decision: {delivery_state: in_transit}, entities: {order_ids: [ORD-100004], items: [air fryer]}}
    case: {mode: AUTO, disposition: auto_replied}
    forbidden_actions: [create_return, issue_refund, cancel_order]
    reply:
      must_contain: [{order_id: ORD-100004}, {tracking: EK8667526689IN}]

