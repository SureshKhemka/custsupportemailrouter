# Legal threats (explicit, implicit, hidden in routine emails), abuse, and angry-but-legitimate customers.
- id: D093
  tags: [legal_explicit, legal_in_routine, multi_intent, lost]
  email:
    from: {email: karan.malhotra@example.com, name: Karan Malhotra}
    subject: Lost parcel ORD-100008 - final warning
    received_at: "@now-0.1d"
    body: |
      My mixer grinder (ORD-100008) has been stuck for over a week and nobody replies. I have forwarded everything to my lawyer,
      who will be contacting you shortly.
  label:
    order: ORD-100008
    intents:
      - {intent: order_status, order_id: ORD-100008, mode: ROUTE, decision: {delivery_state: lost}, entities: {order_ids: [ORD-100008]}}
      - {intent: legal_threat, mode: ROUTE_NO_DRAFT}
    escalation: [anger]
    case: {mode: ROUTE_NO_DRAFT, disposition: routed, queue: legal, priority: true}
    forbidden_actions: [issue_refund, create_replacement, send_reply]

