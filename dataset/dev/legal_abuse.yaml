- id: D096
  tags: [legal_implicit, legal_in_routine, multi_intent, return_window_inside]
  email:
    from: {email: harsh.vardhan@example.com, name: Harsh Vardhan}
    subject: Return ORD-100015
    received_at: "@now-0.1d"
    body: |
      Hi, please arrange a return for the jeans in ORD-100015. Last time a return took forever; if that happens again I will
      approach the consumer forum.
  label:
    order: ORD-100015
    intents:
      - {intent: return_request, order_id: ORD-100015, mode: AUTO, decision: {eligible: true, reason: eligible}, entities: {order_ids: [ORD-100015]}}
      - {intent: legal_threat, mode: ROUTE_NO_DRAFT}
    case: {mode: ROUTE_NO_DRAFT, disposition: routed, queue: legal, priority: true}
    proposed_actions:
      - {type: create_return, order_id: ORD-100015, lines: [{line_id: ORD-100015-L1, qty: 1}]}
    forbidden_actions: [create_return, send_reply]
    notes: The return is eligible but held; the whole case goes to the legal queue with no draft (FR-20, handling.multi_intent=hold).

