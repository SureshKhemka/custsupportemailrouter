- id: D077
  tags: [wrong_facts_quoted]
  email:
    from: {email: olivia.brown@example.com, name: Olivia Brown}
    subject: Overcharged on ORD-100034
    received_at: "@now-0.2d"
    body: |
      You charged me ₹3,999 for ORD-100034 but my cart total was lower. Please explain the difference.
  label:
    order: ORD-100034
    intents:
      - {intent: billing_dispute, order_id: ORD-100034, mode: ROUTE, decision: {duplicate_charge: false}, entities: {order_ids: [ORD-100034], amounts: [3999]}}
    case: {mode: ROUTE, disposition: routed, queue: billing}
    reply:
      must_not_contain: [{amount: 3999}]
    notes: The actual charge was 3,796; any draft must not confirm 3,999.

- id: D078
  tags: [no_order_needed]
  email:
    from: {email: daniel.fischer@example.com, name: Daniel Fischer}
    subject: Card keeps getting declined
    received_at: "@now-0.1d"
    body: |
      Every time I try to check out, my card is declined, although it works everywhere else. Can you help?
  label:
    order: not_needed
    intents:
      - {intent: payment_issue, mode: ROUTE}
    case: {mode: ROUTE, disposition: routed, queue: billing}

- id: D079
