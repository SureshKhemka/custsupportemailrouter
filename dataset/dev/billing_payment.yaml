# Billing disputes and payment issues: always ROUTE to the billing queue, never AUTO (FR-18, FR-19).
- id: D073
  tags: [simple, duplicate_charge]
  email:
    from: {email: payal.sethi@example.com, name: Payal Sethi}
    subject: Charged twice for hair dryer
    received_at: "@now-0.1d"
    body: |
      Hi, my card statement shows two charges of ₹1,599 for the hair dryer, order ORD-100039. Please refund the extra one.
  label:
    order: ORD-100039
    intents:
      - {intent: billing_dispute, order_id: ORD-100039, mode: ROUTE, decision: {duplicate_charge: true}, entities: {order_ids: [ORD-100039], amounts: [1599], remedy: refund}}
    case: {mode: ROUTE, disposition: routed, queue: billing}
    forbidden_actions: [issue_refund]

- id: D074
  tags: [failed_payment, multi_intent]
  email:
    from: {email: yash.thakur@example.com, name: Yash Thakur}
    subject: Payment failed but money deducted?
    received_at: "@now-0.2d"
    body: |
      When I ordered the kurta (ORD-100040) the first payment failed and I paid again. Was I charged twice? Please check.
  label:
    order: ORD-100040
    intents:
      - {intent: payment_issue, order_id: ORD-100040, mode: ROUTE, decision: {failed_payment: true}, entities: {order_ids: [ORD-100040]}}
      - {intent: billing_dispute, order_id: ORD-100040, mode: ROUTE, decision: {duplicate_charge: false}, entities: {order_ids: [ORD-100040]}}
    case: {mode: ROUTE, disposition: routed, queue: billing}
    notes: '"Was I charged twice?" disputes the charge as well as reporting the failed payment (label corrected in M6, D-047).'
    forbidden_actions: [issue_refund]

