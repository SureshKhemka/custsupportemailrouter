# Non-English emails. Only English is supported (D-001), so every case here goes to a human
# (FR-5). Intents and decisions are still labelled for classification and language evals.
- id: D151
  tags: [unsupported_language]
  email:
    from: {email: rohan.mehta@example.com, name: रोहन मेहता}
    subject: मेरा ऑर्डर कब आएगा?
    received_at: "@now-0.1d"
    body: |
      नमस्ते, मैंने ORD-100001 में स्मार्टफोन ऑर्डर किया था। यह कब तक भेजा जाएगा? कृपया बताइए।
      धन्यवाद, रोहन
  label:
    language: hi
    order: ORD-100001
    intents:
      - {intent: order_status, order_id: ORD-100001, mode: AUTO, decision: {delivery_state: not_shipped}, entities: {order_ids: [ORD-100001], items: [smartphone]}}
    case: {mode: ROUTE, disposition: routed, queue: general}

