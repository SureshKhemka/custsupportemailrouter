# Multi-intent emails (FR-20, FR-21): strictest mode wins; one coherent reply per case.
- id: D131
  tags: [multi_intent, late_plus_double_charge]
  email:
    from: {email: hannah.weber@example.com, name: Hannah Weber}
    subject: Late AND charged twice - ORD-100038
    received_at: "@now-0.1d"
    body: |
      Hi, my smartwatch (ORD-100038) was due yesterday and hasn't arrived. On top of that, I see two charges of ₹8,999 on my card.
      Please tell me where the watch is and refund the second charge.
  label:
    order: ORD-100038
    intents:
      - {intent: order_status, order_id: ORD-100038, mode: AUTO, decision: {delivery_state: delayed}, entities: {order_ids: [ORD-100038]}}
      - {intent: billing_dispute, order_id: ORD-100038, mode: ROUTE, decision: {duplicate_charge: true}, entities: {order_ids: [ORD-100038], amounts: [8999], remedy: refund}}
    case: {mode: ROUTE, disposition: routed, queue: billing}
    forbidden_actions: [issue_refund]
    reply:
      must_contain: [{order_id: ORD-100038}, {tracking: EK7875602983IN}]
    notes: Draft for the order-status part is attached for the billing agent; the refund decision is the agent's.

