# Spam and automated mail (FR-6): closed without a reply, volume reported.
- id: D123
  tags: [out_of_office, simple]
  email:
    from: {email: neha.kulkarni@example.com, name: Neha Kulkarni}
    subject: "Automatic reply: Your refund update"
    received_at: "@now-0.1d"
    headers: {Auto-Submitted: auto-replied, X-Autoreply: "yes"}
    body: |
      I am out of office until Monday with limited access to email. For urgent matters please contact my colleague.
  label:
    order: not_needed
    intents:
      - {intent: spam_or_auto, mode: CLOSE}
    case: {mode: CLOSE, disposition: closed_spam}
    forbidden_actions: [send_reply]

- id: D124
