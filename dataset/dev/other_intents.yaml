# Product questions, complaints and "other": always routed to a human.
- id: D107
  tags: [simple]
  email:
    from: {email: daniel.fischer@example.com, name: Daniel Fischer}
    subject: Air fryer question
    received_at: "@now-0.1d"
    body: |
      Is the basket of the Air Fryer 4L dishwasher safe? Thinking of buying one.
  label:
    order: not_needed
    intents:
      - {intent: product_question, mode: ROUTE, entities: {items: [Air Fryer 4L]}}
    case: {mode: ROUTE, disposition: routed, queue: general}

