llm:
  # CF-2: switching provider is config only. LM Studio and OpenRouter share the
  # OpenAI-compatible adapter; Anthropic uses the official SDK.
  providers:
    lmstudio:
      kind: openai_compat
      base_url: http://localhost:1234/v1
      api_key_env: null          # LM Studio needs no key by default
      # Stops Qwen's thinking mode, which otherwise returns the answer in `reasoning_content`
      # and is slower (measured in M6). Ignored by models without a thinking mode.
      extra: {reasoning_effort: none}
    openrouter:
      kind: openai_compat
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
    anthropic:
      kind: anthropic
      base_url: https://api.anthropic.com
      api_key_env: ANTHROPIC_API_KEY

  # Defaults applied to every step unless the step overrides them.
  defaults:
    temperature: 0.0
    max_tokens: 1500
    timeout_s: 180
    retries: 2
    concurrency: 2

  # Model per LLM step (CF-1). D-003: Qwen 3.8 27B on LM Studio.
  # Model id as LM Studio exposes it (https://lmstudio.ai/models/qwen/qwen3.8-27b).
  steps:
    understand:
      provider: lmstudio
      model: qwen/qwen3.8-27b
      prompt_version: v3        # M6: v2 refund vs refund_status, chargeback threat, anger, side remarks; v3 threats = abuse
    summarize:
      provider: lmstudio
      model: qwen/qwen3.8-27b
      prompt_version: v1
    compose:
      provider: lmstudio
      model: qwen/qwen3.8-27b
      prompt_version: v1
      temperature: 0.3
    judge:
      # EV-8: the judge is configured separately; point it at a different model family when possible.
      provider: lmstudio
      model: google/gemma-4-31b
      prompt_version: v1

  # Record / replay LLM outputs (EV-1, NF-2). Files live in paths.recordings/<name>.jsonl.
  recording:
    mode: "off"            # off | record | replay (quoted: bare off is YAML for false)
    name: default

  # Cost estimates (LL-5), USD per million tokens. Local models cost 0.
  pricing:
    qwen/qwen3.8-27b: {input_per_mtok: 0.0, output_per_mtok: 0.0}
    google/gemma-4-31b: {input_per_mtok: 0.0, output_per_mtok: 0.0}
    claude-opus-5: {input_per_mtok: 5.0, output_per_mtok: 25.0}
    claude-sonnet-5: {input_per_mtok: 2.0, output_per_mtok: 10.0}
    claude-haiku-4-5: {input_per_mtok: 1.0, output_per_mtok: 5.0}
