# Base configuration. Layering order (CF-5):
#   base.yaml (+ its includes) -> config/local.yaml (optional, gitignored) -> --config overlays, in order.
# Dicts merge recursively; lists and scalars in later layers replace earlier ones.
# Secrets never go here: providers name the ENV VAR that holds the key (CF-3).

includes:
  - llm.yaml
  - taxonomy.yaml
  - routing_matrix.yaml
  - handling.yaml
  - replies.yaml
  - escalation.yaml
  - policy.yaml
  - services.yaml
  - faults.yaml
  - evals.yaml

app:
  name: custsupportemailrouter
  # FR-5: only English is supported for now (decision D-001). Emails in any other
  # language are routed to a human.
  supported_languages: [en]
  timezone: Asia/Kolkata

clock:
  # FR-38: fixed "now" for deterministic runs (tests/evals set this). null = real time.
  fixed_now: null
  # Replay mode: evaluate each email "as of" its received_at (the dataset labels assume this).
  process_at_received_time: false

intake:
  # FR-3: near-duplicates from the same sender about the same issue within this window merge into one case.
  near_duplicate_window_minutes: 60
  # Automated mail (FR-6) recognised without an LLM: these sender prefixes, plus Auto-Submitted,
  # X-Autoreply, Precedence: bulk/junk/list, List-Unsubscribe/List-Id and multipart/report headers.
  auto_sender_prefixes: [mailer-daemon, postmaster, noreply, no-reply, donotreply, do-not-reply]

sla:
  # FR-37: SLA per category (intent). Cases take the SLA of their strictest intent.
  default_hours: 4
  per_intent: {}
  # Flag a case as "approaching" once this fraction of its SLA has elapsed.
  approaching_fraction: 0.75

paths:
  # Relative paths resolve against the project root.
  inbox: var/inbox
  outbox: var/outbox
  db_dir: var/db
  logs: var/logs
  reports: var/reports
  dataset: dataset
  seed: seed
  recordings: evals/recordings
  prompts: config/prompts
  templates: config/templates
  tone_guide: config/tone_guide.md
  rubrics: config/rubrics
  mock_state: var/mocks          # mock service state snapshots and call logs
