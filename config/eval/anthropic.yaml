# Eval overlay example (EV-3): run every LLM step on Anthropic models instead of the local Qwen.
llm:
  steps:
    understand: {provider: anthropic, model: claude-sonnet-5}
    summarize:  {provider: anthropic, model: claude-haiku-4-5-20251001}
    compose:    {provider: anthropic, model: claude-sonnet-5}
    judge:      {provider: anthropic, model: claude-opus-5-5}
