# Eval overlay (EV-3): run the LLM steps on Anthropic models instead of the local Qwen.
# Requires ANTHROPIC_API_KEY. Current Claude models reject sampling parameters, so temperature is unset.
llm:
  steps:
    understand: {provider: anthropic, model: claude-opus-5, temperature: null, extra: {output_config: {effort: low}}, concurrency: 8}
    summarize:  {provider: anthropic, model: claude-opus-5, temperature: null, extra: {output_config: {effort: low}}, concurrency: 8}
    compose:    {provider: anthropic, model: claude-opus-5, temperature: null, extra: {output_config: {effort: medium}}, concurrency: 8}
    judge:      {provider: anthropic, model: claude-sonnet-5, temperature: null, concurrency: 8}
